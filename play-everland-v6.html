<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>에버랜드 - 놀이기구 아케이드</title>
<style>
  :root{
    --bg:#dff3ff; --grass:#bfe8a3; --grass2:#a9dd8c; --path:#f5e6c8; --path2:#e8d3a8;
    --pink:#ff8fb1; --yellow:#ffd766; --blue:#7ec8ff; --purple:#b79cff; --green:#7ad38e;
    --ink:#3b3b58; --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);overflow:hidden;user-select:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* 상단 바 */
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;box-shadow:0 2px 10px rgba(60,60,100,.12);z-index:5}
  #topbar h1{font-size:18px;display:flex;align-items:center;gap:8px}
  #topbar h1 .logo{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--yellow));display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  #hint{font-size:12px;color:#7a7a99;background:#f3f3fb;padding:6px 10px;border-radius:20px;white-space:nowrap}
  @media (max-width:480px){#hint{display:none}}
  #crumb{font-size:13px;color:#7a7a99;font-weight:700;margin-left:6px}
  #btnOverview{display:none;border:none;background:#f0f0fa;color:var(--ink);font-weight:800;font-family:inherit;padding:7px 12px;border-radius:14px;cursor:pointer;box-shadow:0 3px 0 #d2d2e2;font-size:13px}
  #btnOverview:active{transform:translateY(2px);box-shadow:0 1px 0 #d2d2e2}
  .right{display:flex;align-items:center;gap:8px}

  /* 지도 캔버스 */
  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{display:block;border-radius:14px;box-shadow:0 8px 30px rgba(60,80,120,.18);cursor:pointer;touch-action:none}

  /* 말풍선 안내 */
  #toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;padding:8px 16px;border-radius:30px;font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.12);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}

  /* 소개 화면 */
  #intro{position:fixed;inset:0;background:rgba(40,40,80,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  #intro.open{display:flex;animation:fade .25s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{background:var(--card);border-radius:28px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .card .art{height:240px;border-radius:28px 28px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .card .art svg{width:100%;height:100%}
  .card .body{padding:20px 24px 24px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;color:#fff;margin-bottom:8px}
  .card h2{font-size:26px;margin-bottom:6px}
  .card p{font-size:15px;line-height:1.6;color:#5c5c7a;margin-bottom:14px}
  .meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .meta div{background:#f5f5fd;border-radius:14px;padding:8px 12px;font-size:13px}
  .meta b{display:block;font-size:11px;color:#9a9ab8;font-weight:700;margin-bottom:2px}
  .btns{display:flex;gap:10px}
  .btn{flex:1;border:none;border-radius:18px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .1s}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--pink);color:#fff;box-shadow:0 5px 0 #e0658f}
  .btn.primary:disabled{background:#d8d8e6;box-shadow:0 5px 0 #b9b9cc;cursor:not-allowed;color:#fff}
  .btn.ghost{background:#f0f0fa;color:var(--ink);box-shadow:0 5px 0 #d2d2e2}

  /* 미니게임 오버레이 (iframe) */
  #gameWrap{position:fixed;inset:0;background:#1e1e34;display:none;flex-direction:column;z-index:40}
  #gameWrap.open{display:flex}
  #gameBar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);z-index:2}
  #gameBar b{font-size:15px}
  #gameBar button{border:none;background:#f0f0fa;color:var(--ink);font-weight:800;font-family:inherit;padding:8px 14px;border-radius:14px;cursor:pointer;box-shadow:0 3px 0 #d2d2e2}
  #gameFrame{flex:1;width:100%;border:0;background:#fff}
  /* 결과 카드 */
  #result{position:fixed;inset:0;background:rgba(30,30,60,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  #result.open{display:flex;animation:fade .25s}
  #result .card{width:min(420px,100%);text-align:center;padding:28px 24px 24px}
  #result .score{font-size:48px;font-weight:900;color:var(--pink);margin:6px 0}
  #result .best{font-size:13px;color:#9a9ab8;margin-bottom:18px}
  #result .rank{display:inline-block;background:var(--yellow);color:#6b4e00;font-weight:900;padding:4px 14px;border-radius:20px;font-size:14px}

  /* 시작 화면 */
  #splash{position:fixed;inset:0;background:linear-gradient(160deg,#ffe3ec,#dff3ff 50%,#e9ffe0);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center;padding:20px}
  #splash .big{font-size:52px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#ff6f9c,#ffb347,#4fc3f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  #splash .sub{font-size:16px;color:#7a7a99;margin:8px 0 28px}
  #splash .btn{flex:none;padding:16px 44px;font-size:20px}
  #splash .deco{font-size:60px;margin-bottom:10px;animation:bounce 1.6s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .ver{position:absolute;bottom:12px;font-size:11px;color:#a8a8c4}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1><span class="logo">🎡</span><span id="crumb">에버랜드</span></h1>
    <div class="right">
      <div id="hint">먼저 가고 싶은 구역을 클릭하세요!</div>
      <button id="btnOverview">◀ 전체 지도</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="toast"></div>
  </div>
</div>

<!-- 소개 화면 -->
<div id="intro">
  <div class="card">
    <div class="art" id="introArt"></div>
    <div class="body">
      <span class="tag" id="introTag"></span>
      <h2 id="introName"></h2>
      <p id="introDesc"></p>
      <div class="meta" id="introMeta"></div>
      <div class="btns">
        <button class="btn ghost" id="btnBack">🗺️ 지도로 돌아가기</button>
        <button class="btn primary" id="btnPlay">🎮 게임 시작</button>
      </div>
    </div>
  </div>
</div>

<!-- 미니게임 오버레이 -->
<div id="gameWrap">
  <div id="gameBar"><b id="gameTitle"></b><button id="btnQuit">✕ 그만하기</button></div>
  <iframe id="gameFrame" allow="autoplay; fullscreen"></iframe>
</div>

<!-- 결과 화면 -->
<div id="result">
  <div class="card">
    <div style="font-size:40px">🎉</div>
    <h2 id="resultName"></h2>
    <div class="score" id="resultScore">0</div>
    <div><span class="rank" id="resultRank"></span></div>
    <div class="best" id="resultBest"></div>
    <div class="btns">
      <button class="btn ghost" id="btnResultMap">🗺️ 지도로</button>
      <button class="btn primary" id="btnRetry">🔁 다시 하기</button>
    </div>
  </div>
</div>

<!-- 시작 화면 -->
<div id="splash">
  <div class="deco">🎢</div>
  <div class="big">에버랜드</div>
  <div class="sub">놀이기구 아케이드 · 구역을 고르고, 구역 안에서 기구를 골라보세요</div>
  <button class="btn primary" id="btnStart">입장하기</button>
  <div class="ver">v6.0 · 스카이크루즈·스카이웨이·휴먼스카이로 구역 연결</div>
</div>

<script>
/* =========================================================
   에버랜드 v6 - 공중 이동수단(곤돌라·리프트) 연결 / 실제 가이드맵 윤곽 지도: 구역 선택 → 줌인 → 기구 선택 → 미니게임
   ========================================================= */
const W = 1000, H = 700;            // 논리 좌표계
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
let scale = 1, offX = 0, offY = 0;

/* ---------- 테마 구역 (실제 에버랜드 가이드맵 배치 기준) ----------
   정문(글로벌페어) 우하단 → 북쪽 아메리칸 어드벤처 → 북쪽 매직랜드
   → 서쪽 유러피언 어드벤처(T익스프레스) → 남서쪽 주토피아(동물원) */
/* 실제 에버랜드 가이드맵 윤곽을 1000×700 좌표로 옮김.
   정문(아래 중앙) → 글로벌페어 → 매직트리 광장에서 방사형 분기:
   서쪽 주토피아(가장 넓음) / 북쪽 유러피언(상단 띠) / 북동 매직랜드 / 동쪽 아메리칸
   poly: 구역 윤곽 폴리곤 / entry: 구역 입구(캐릭터가 멈추는 지점) / emoji: 표지판 아이콘 */
const ZONES = [
  { id:'global',   name:'글로벌페어',        emoji:'🎪', fill:'#ffe9c2', stroke:'#f3c76f', entry:{x:612,y:500},
    poly:[[545,478],[720,478],[785,520],[775,600],[600,615],[525,575]] },
  { id:'american', name:'아메리칸 어드벤처', emoji:'🎠', fill:'#ffd9e3', stroke:'#ff9ab8', entry:{x:700,y:400},
    poly:[[605,290],[790,278],[905,315],[915,440],[830,480],[735,470],[650,452],[605,390]] },
  { id:'magic',    name:'매직랜드',          emoji:'🎡', fill:'#e6dcff', stroke:'#b79cff', entry:{x:700,y:245},
    poly:[[660,70],[850,70],[960,120],[960,250],[880,275],[760,265],[670,258],[640,200],[640,120]] },
  { id:'european', name:'유러피언 어드벤처', emoji:'🎢', fill:'#d8f0ff', stroke:'#7ec8ff', entry:{x:560,y:270},
    poly:[[120,95],[420,40],[630,70],[628,215],[595,295],[470,325],[360,300],[220,320],[110,230]] },
  { id:'zootopia', name:'주토피아',          emoji:'🐼', fill:'#d9f3c9', stroke:'#7ad38e', entry:{x:520,y:430},
    poly:[[40,360],[200,335],[370,330],[520,370],[560,440],[500,540],[360,640],[110,640],[30,520]] },
];
// 폴리곤 유틸: 바운딩 박스 / 내부 판정
ZONES.forEach(z => {
  const xs = z.poly.map(p=>p[0]), ys = z.poly.map(p=>p[1]);
  z.x = Math.min(...xs); z.y = Math.min(...ys); z.w = Math.max(...xs)-z.x; z.h = Math.max(...ys)-z.y;
});
function inPoly(p, poly){
  let c = false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++){
    const [xi,yi] = poly[i], [xj,yj] = poly[j];
    if ((yi>p.y)!==(yj>p.y) && p.x < (xj-xi)*(p.y-yi)/(yj-yi)+xi) c = !c;
  }
  return c;
}
function zoneOf(r){ return ZONES.find(z => inPoly(r, z.poly)); }
function ridesIn(z){ return RIDES.filter(r => zoneOf(r)===z); }

/* 공원 전체 윤곽 (섬 형태, 바깥은 숲) + 비플레이 랜드마크 */
const PARK = [[330,30],[500,20],[640,40],[800,45],[970,95],[975,300],[930,430],[860,570],[800,630],[600,665],[280,670],[80,660],[15,520],[20,330],[40,110]];
/* 공중 이동수단 (실제 연결 구간)
   스카이크루즈: 아메리칸(키즈커버리·범퍼카 옆) ↔ 유러피언(포시즌스 가든)
   스카이웨이:   아메리칸(락스빌)            ↔ 유러피언(카니발 광장)
   휴먼스카이:   글로벌페어               ↔ 주토피아 */
const LIFTS = [
  { id:'skycruise', name:'스카이크루즈', kind:'곤돌라 8인승', emoji:'🚡', color:'#ff6f9c',
    a:{ zone:'american', x:622, y:335, label:'키즈커버리' }, b:{ zone:'european', x:430, y:240, label:'포시즌스 가든' } },
  { id:'skyway',    name:'스카이웨이',   kind:'리프트 4인승', emoji:'🚠', color:'#4a9ddc',
    a:{ zone:'american', x:870, y:450, label:'락스빌' },      b:{ zone:'european', x:545, y:245, label:'카니발 광장' } },
  { id:'humansky',  name:'휴먼스카이',   kind:'리프트 2인승', emoji:'🚡', color:'#3f9456',
    a:{ zone:'global',   x:555, y:520, label:'매직트리 옆' },  b:{ zone:'zootopia', x:440, y:540, label:'판다월드 아래' } },
];
const zoneById = id => ZONES.find(z=>z.id===id);
function stationsIn(z){ const out=[]; LIFTS.forEach(L=>{ if(L.a.zone===z.id) out.push({lift:L, from:L.a, to:L.b}); if(L.b.zone===z.id) out.push({lift:L, from:L.b, to:L.a}); }); return out; }
function hitStation(p){ if(mode!=='zone') return null; return stationsIn(currentZone).find(s => Math.hypot(p.x-s.from.x, p.y-s.from.y) < 26) || null; }

const LANDMARKS = [
  { name:'매직트리 광장', x:612, y:430, kind:'tree' },
  { name:'장미원',       x:520, y:95,  kind:'rose' },
  { name:'포시즌스 가든', x:470, y:190, kind:'garden' },
  { name:'써더폴스',     x:850, y:140, kind:'water' },
  { name:'롤링X트레인',  x:650, y:335, kind:'coaster' },
];

/* ---------- 카메라 (전체 지도 ↔ 구역 줌) ----------
   mode: 'overview' = 구역 선택 단계 / 'zone' = 구역 안 기구 선택 단계 */
let mode = 'overview';
let currentZone = null;
const cam = { cx:W/2, cy:H/2, s:1 };                 // 현재 카메라
const camTarget = { cx:W/2, cy:H/2, s:1 };           // 목표 카메라 (부드럽게 보간)
function zoneCam(z){
  const pad = 40;
  const s = Math.min(W/(z.w+pad*2), H/(z.h+pad*2), 2.4);
  return { cx:z.x+z.w/2, cy:z.y+z.h/2, s };
}
function enterZone(z){
  mode = 'zone'; currentZone = z; hover = null;
  Object.assign(camTarget, zoneCam(z));
  document.getElementById('crumb').textContent = `에버랜드 › ${z.name}`;
  document.getElementById('btnOverview').style.display = 'inline-block';
  const n = stationsIn(z).length;
  document.getElementById('hint').textContent = n ? '놀이기구 또는 🚡 탑승장을 클릭하세요!' : '놀이기구를 클릭하면 캐릭터가 걸어가요!';
  toast(`${z.emoji} ${z.name}에 도착! 기구를 골라보세요`, 2200);
}
function boardLift(st){
  mode = 'lift'; hover = null;
  const to = zoneById(st.to.zone);
  const dist = Math.hypot(st.to.x-st.from.x, st.to.y-st.from.y);
  player.riding = { lift:st.lift, from:st.from, to:st.to, t:0, speed: 1/Math.max(90, dist/2.2) };
  player.moving = false; player.x = st.from.x; player.y = st.from.y;
  document.getElementById('crumb').textContent = `에버랜드 › ${st.lift.emoji} ${st.lift.name}`;
  document.getElementById('btnOverview').style.display = 'none';
  toast(`${st.lift.emoji} ${st.lift.name} 탑승! ${to.emoji} ${to.name}(으)로 이동 중…`, 2600);
}
function exitZone(){
  mode = 'overview'; currentZone = null; hover = null;
  player.target = null; player.targetZone = null; player.targetStation = null; player.moving = false;
  Object.assign(camTarget, { cx:W/2, cy:H/2, s:1 });
  document.getElementById('crumb').textContent = '에버랜드';
  document.getElementById('btnOverview').style.display = 'none';
  document.getElementById('hint').textContent = '먼저 가고 싶은 구역을 클릭하세요!';
}

/* ---------- 놀이기구 데이터 ---------- */
const RIDES = [
  { id:'texpress',  name:'T익스프레스', tag:'롤러코스터', color:'#ff8fb1', x:300, y:140, w:150, h:105, icon:'coaster',
    desc:'아시아 최초 목재 롤러코스터! 77도 경사에서 떨어지는 짜릿함을 느껴보세요.', thrill:5, wait:'60분', type:'스릴' },
  { id:'safari',    name:'사파리 월드', tag:'동물원', color:'#ffb347', x:140, y:430, w:150, h:110, icon:'safari',
    desc:'사자, 호랑이, 곰이 사는 초원을 버스로 누비는 야생 탐험.', thrill:2, wait:'30분', type:'탐험' },
  { id:'panda',     name:'판다월드', tag:'동물원', color:'#9ad87a', x:445, y:455, w:130, h:100, icon:'panda',
    desc:'푸바오 가족이 대나무를 먹는 모습을 가까이서 볼 수 있어요.', thrill:1, wait:'40분', type:'힐링' },
  { id:'amazon',    name:'아마존 익스프레스', tag:'급류 래프팅', color:'#5ec8e8', x:200, y:560, w:150, h:105, icon:'raft',
    desc:'거센 물살을 따라 빙글빙글! 옷이 젖어도 즐거운 급류 타기.', thrill:3, wait:'25분', type:'워터' },
  { id:'lostvalley',name:'로스트밸리', tag:'정글 탐험', color:'#b79cff', x:300, y:420, w:140, h:105, icon:'jeep',
    desc:'수륙양용차를 타고 기린과 코끼리를 만나는 정글 탐험.', thrill:2, wait:'45분', type:'탐험' },
  { id:'hurricane', name:'허리케인', tag:'회전 어트랙션', color:'#7ec8ff', x:830, y:370, w:110, h:90, icon:'hurricane',
    desc:'거대한 추가 360도로 돌아가는 어지러운 스릴 머신!', thrill:4, wait:'20분', type:'스릴' },
  { id:'carousel',  name:'회전목마', tag:'클래식', color:'#ffd766', x:720, y:150, w:110, h:100, icon:'carousel',
    desc:'알록달록 말을 타고 빙글빙글, 모두가 사랑하는 클래식 기구.', thrill:1, wait:'10분', type:'힐링' },
  { id:'ferris',    name:'관람차', tag:'클래식', color:'#ff9d76', x:870, y:190, w:105, h:105, icon:'ferris',

/* 캐릭터 */
const player = { x:612, y:625, tx:612, ty:625, speed:3.2, moving:false, target:null, targetZone:null, frame:0, dir:1 };

/* ---------- 캔버스 리사이즈 (반응형) ---------- */
function resize(){
  const stage = document.getElementById('stage');
  const pad = 12;
  const sw = stage.clientWidth - pad*2, sh = stage.clientHeight - pad*2;
  scale = Math.min(sw / W, sh / H);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = (W*scale)+'px';
  canvas.style.height = (H*scale)+'px';
  canvas.width = W*scale*dpr; canvas.height = H*scale*dpr;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
window.addEventListener('resize', resize);

/* ---------- 입력 ---------- */
function toLogical(e){
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  // 화면 → 논리 좌표 → 카메라 역변환(월드 좌표)
  const lx = cx/scale, ly = cy/scale;
  return { x: (lx - W/2)/cam.s + cam.cx, y: (ly - H/2)/cam.s + cam.cy };
}
function hitRide(p){
  const list = mode==='zone' ? ridesIn(currentZone) : RIDES;
  return list.find(r => p.x>=r.x-r.w/2 && p.x<=r.x+r.w/2 && p.y>=r.y-r.h/2 && p.y<=r.y+r.h/2);
}
function hitZone(p){
  return ZONES.find(z => inPoly(p, z.poly));
}
let hover = null;        // overview: 구역 / zone: 기구
canvas.addEventListener('mousemove', e => {
  const p = toLogical(e);
  hover = mode==='overview' ? hitZone(p) : mode==='zone' ? (hitStation(p) || hitRide(p)) : null;
  canvas.style.cursor = hover?'pointer':'default';
});
canvas.addEventListener('click', e => onTap(toLogical(e)));
canvas.addEventListener('touchstart', e => { e.preventDefault(); onTap(toLogical(e)); }, {passive:false});

function onTap(p){
  if (document.getElementById('intro').classList.contains('open')) return;
  if (mode === 'lift') return;                         // 탑승 중엔 조작 불가
  if (mode === 'overview'){
    /* 1단계: 구역 선택 → 구역 입구로 걸어간 뒤 줌인 */
    const z = hitZone(p);
    if (!z) return;
    player.target = null; player.targetZone = z;
    player.tx = z.entry.x; player.ty = z.entry.y;
    player.moving = true;
    toast(`🚶 ${z.emoji} ${z.name}(으)로 이동 중…`);
    return;
  }
  /* 2단계: 구역 안에서 기구 선택 */
  const z = currentZone;
  if (!inPoly(p, z.poly)){
    toast('↩ 다른 구역으로 가려면 「전체 지도」를 누르세요'); return;
  }
  const st = hitStation(p);
  if (st){
    player.target = null; player.targetStation = st;
    player.tx = st.from.x; player.ty = st.from.y + 14;
    player.moving = true;
    toast(`🚶 ${st.lift.emoji} ${st.lift.name} 탑승장으로 이동 중…`);
    return;
  }
  const ride = hitRide(p);
  if (ride){
    player.target = ride;
    player.tx = ride.x; player.ty = ride.y + ride.h/2 + 18;   // 입구 (기구 아래쪽)
    toast(`🚶 ${ride.name}(으)로 이동 중…`);
  } else {
    player.target = null;
    player.tx = Math.max(z.x+20, Math.min(z.x+z.w-20, p.x));
    player.ty = Math.max(z.y+20, Math.min(z.y+z.h-20, p.y));
  }
  player.moving = true;
}

function toast(msg, ms=1800){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), ms);
}

/* ---------- 업데이트 ---------- */
function update(){
  // 카메라 보간
  const k = 0.12;
  cam.cx += (camTarget.cx-cam.cx)*k; cam.cy += (camTarget.cy-cam.cy)*k; cam.s += (camTarget.s-cam.s)*k;
  // 공중 이동 중: 케이블을 따라 보간 + 카메라 추적
  if (player.riding){
    const R = player.riding; R.t += R.speed;
    const u = R.t < 1 ? R.t : 1, e = u<0.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;   // ease in-out
    player.x = R.from.x + (R.to.x-R.from.x)*e; player.y = R.from.y + (R.to.y-R.from.y)*e;
    player.dir = R.to.x < R.from.x ? -1 : 1;
    camTarget.cx = player.x; camTarget.cy = player.y; camTarget.s = 1.5;
    if (R.t >= 1){ const to = zoneById(R.to.zone); player.riding = null; player.y += 14; setTimeout(()=>{ enterZone(to); toast(`${R.lift.emoji} ${R.lift.name} 도착! ${to.name}입니다`, 2200); }, 200); }
    return;
  }
  if (!player.moving) return;
  const dx = player.tx - player.x, dy = player.ty - player.y;
  const d = Math.hypot(dx,dy);
  const spd = mode==='overview' ? player.speed*1.6 : player.speed;   // 전체 지도에선 거리가 머니 조금 빠르게
  if (d < spd){
    player.x = player.tx; player.y = player.ty; player.moving = false;
    if (player.targetZone){ const z = player.targetZone; player.targetZone = null; setTimeout(()=>enterZone(z), 150); }
    else if (player.targetStation){ const s = player.targetStation; player.targetStation = null; setTimeout(()=>boardLift(s), 250); }
    else if (player.target){ const r = player.target; player.target = null; setTimeout(()=>openIntro(r), 200); }
    return;
  }
  player.x += dx/d*spd; player.y += dy/d*spd;
  player.dir = dx < 0 ? -1 : 1;
  player.frame += 0.25;
}

/* ---------- 그리기 ---------- */
let t = 0;
function draw(){
  t += 0.02;
  ctx.fillStyle = '#bfe8a3'; ctx.fillRect(0,0,W,H);
  // 카메라 적용 (월드 → 화면)
  ctx.save();
  ctx.translate(W/2, H/2); ctx.scale(cam.s, cam.s); ctx.translate(-cam.cx, -cam.cy);
  // 공원 바깥 = 숲/산 (진한 초록)
  ctx.fillStyle = '#86c48a'; ctx.fillRect(-W,-H,W*3,H*3);
  ctx.fillStyle = '#79b97e';
  for (let i=0;i<70;i++){ const x=((i*173)%1100)-50, y=((i*271)%800)-50; ctx.beginPath(); ctx.ellipse(x,y,30,16,0,0,Math.PI*2); ctx.fill(); }
  FOREST.forEach(([x,y],i)=>tree(x,y, i%3?'#4fa763':'#3f9456'));
  // 공원 섬 윤곽 (잔디)
  ctx.fillStyle='rgba(0,0,0,.12)'; poly(PARK, 6, 8); ctx.fill();
  ctx.fillStyle = '#c4ebaa'; poly(PARK); ctx.fill();
  ctx.strokeStyle = '#a7d98b'; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = '#b8e49c';
  for (let i=0;i<40;i++){ const x=(i*137)%W, y=(i*251)%H; if(inPoly({x,y},PARK)){ ctx.beginPath(); ctx.ellipse(x,y,26,14,0,0,Math.PI*2); ctx.fill(); } }
  // 테마 구역 (실제 윤곽 폴리곤)
  ZONES.forEach(z=>{
    const hl = mode==='overview' && hover===z;
    ctx.fillStyle = hl ? lighten(z.fill) : z.fill; poly(z.poly); ctx.fill();
    ctx.strokeStyle = z.stroke; ctx.lineWidth = hl ? 6 : 3; ctx.setLineDash(hl?[]:[12,8]); ctx.stroke(); ctx.setLineDash([]);
  });
  // 물: 써더폴스 수로(매직랜드) / 포시즌스 연못(유러피언) / 아마존 급류(주토피아)
  ctx.fillStyle = '#9fdcf5';
  rr(800,100,120,50,25); ctx.fill(); rr(420,160,70,40,20); ctx.fill(); rr(110,590,90,36,18); ctx.fill();
  ctx.fillStyle = '#b8e7fb'; rr(815,112,70,22,11); ctx.fill(); rr(432,170,36,16,8); ctx.fill();

  // 길 : 정문 → 글로벌페어 → 매직트리 광장에서 방사형 (실제 동선)
  ctx.strokeStyle = '#f3e4c4'; ctx.lineWidth = 36; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(612,650); ctx.lineTo(612,440);                                   // 정문 → 글로벌페어 → 매직트리 광장
  ctx.moveTo(612,440); ctx.lineTo(520,430); ctx.lineTo(330,470); ctx.lineTo(160,480); ctx.lineTo(200,600); // 서쪽 주토피아 순환
  ctx.moveTo(612,440); ctx.lineTo(560,270); ctx.lineTo(470,250); ctx.lineTo(300,210);           // 북쪽 유러피언 (T익스프레스)
  ctx.moveTo(560,270); ctx.lineTo(700,245); ctx.lineTo(760,215); ctx.lineTo(870,245);           // 북동 매직랜드
  ctx.moveTo(612,440); ctx.lineTo(700,400); ctx.lineTo(800,420); ctx.lineTo(840,380);           // 동쪽 아메리칸
  ctx.stroke();
  ctx.strokeStyle = '#e2cfa4'; ctx.lineWidth = 2; ctx.setLineDash([10,10]); ctx.stroke(); ctx.setLineDash([]);
  // 퍼레이드 루트 (붉은 점선: 유러피언 → 광장 → 아메리칸)
  ctx.strokeStyle = '#ff6fb5'; ctx.lineWidth = 3; ctx.setLineDash([6,8]);
  ctx.beginPath(); ctx.moveTo(470,250); ctx.lineTo(560,270); ctx.lineTo(612,440); ctx.lineTo(700,400); ctx.stroke(); ctx.setLineDash([]);

  // 랜드마크 (비플레이, 장식)
  LANDMARKS.forEach(drawLandmark);

  // 정문 게이트
  ctx.fillStyle='#ff8fb1'; rr(552,642,120,24,9); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('▲ 정문 입구', 612, 654);

  // 공원 안 나무
  const trees = [[180,370],[60,470],[80,560],[420,600],[560,460],[400,330],[150,250],[240,90],[560,120],[600,230],[700,90],[930,160],[940,300],[760,470],[880,440],[760,300],[490,380],[560,580],[700,600]];
  trees.forEach(([x,y],i)=>tree(x,y, i%2?'#6cc37a':'#53b56a'));

  // 놀이기구: 전체 지도에선 숨김 → 줌인하면서 나타남 (전체 지도는 구역+표지판만)
  const dim = Math.max(0, Math.min(1, (cam.s-1)/0.35));
  if (dim > 0.02){
    ctx.globalAlpha = dim;
    RIDES.forEach(r => drawRide(r, mode==='zone' && hover===r));
    ctx.globalAlpha = 1;
  }

  // 공중 이동수단: 탑승장(땅) → 캐릭터 → 케이블·캐빈(하늘)
  LIFTS.forEach(drawStations);
  if (!player.riding) drawPlayer();
  LIFTS.forEach(drawCable);
  if (player.riding) drawPlayer();

  // 구역 표지판 (전체 지도 모드에서만, 줌인되면 서서히 사라짐)
  const signA = 1 - dim;
  if (signA > 0.02){
    ctx.globalAlpha = signA;
    ZONES.forEach(z => drawZoneSign(z, mode==='overview' && hover===z));
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* 탑승장: 작은 지붕 + 기둥. 구역 모드에서 자기 구역 탑승장은 클릭 가능 + 행선지 라벨 */
function drawStations(L){
  [[L.a,L.b],[L.b,L.a]].forEach(([s,o])=>{
    const active = mode==='zone' && currentZone && s.zone===currentZone.id;
    const hl = active && hover && hover.from===s;
    ctx.save(); ctx.translate(s.x, s.y);
    ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(2,16,16,6,0,0,7); ctx.fill();
    ctx.fillStyle='#8d6744'; ctx.fillRect(-12,-4,4,18); ctx.fillRect(8,-4,4,18);
    ctx.fillStyle = hl ? '#fff' : L.color; rr(-18,-16,36,14,5); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=L.color; ctx.stroke();
    ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#000'; ctx.fillText(L.emoji, 0, -9);
    if (active){
      const z = zoneById(o.zone);
      const txt = `${L.name} → ${z.name}`;
      ctx.font='bold 9px sans-serif'; const w = ctx.measureText(txt).width + 14;
      ctx.fillStyle = hl ? L.color : 'rgba(255,255,255,.95)'; rr(-w/2, 20, w, 15, 7); ctx.fill();
      ctx.strokeStyle=L.color; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle = hl ? '#fff' : '#3b3b58'; ctx.fillText(txt, 0, 27.5);
    }
    ctx.restore();
  });
}
/* 케이블 + 철탑 + 오가는 캐빈 (장식 애니메이션) */
function drawCable(L){
  const a=L.a, b=L.b, dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), nx=-dy/d, ny=dx/d;
  // 철탑
  const n = Math.max(2, Math.round(d/110));
  for (let i=0;i<=n;i++){ const u=i/n, x=a.x+dx*u, y=a.y+dy*u-24;
    ctx.strokeStyle='#9aa0b4'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,y+24); ctx.lineTo(x,y); ctx.stroke();
    ctx.fillStyle='#9aa0b4'; ctx.fillRect(x-7,y-2,14,4); }
  // 케이블 2가닥
  ctx.strokeStyle='#6f7590'; ctx.lineWidth=1.5;
  [-4,4].forEach(o=>{ ctx.beginPath(); ctx.moveTo(a.x+nx*o, a.y-26+ny*o); ctx.lineTo(b.x+nx*o, b.y-26+ny*o); ctx.stroke(); });
  // 캐빈 (양방향, 탑승 중일 때는 캐릭터 캐빈이 따로 그려짐)
  const spd = 0.12 / (d/100);
  for (let i=0;i<3;i++){
    const u = ((t*spd + i/3) % 1), v = 1-u;
    cabin(a.x+dx*u+nx*4, a.y-26+dy*u+ny*4, L, 0.8);
    cabin(a.x+dx*v-nx*4, a.y-26+dy*v-ny*4, L, 0.8);
  }
}
function cabin(x, y, L, s=1){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.strokeStyle='#555'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,10); ctx.stroke();
  ctx.fillStyle=L.color; rr(-11,10,22,16,5); ctx.fill();
  ctx.fillStyle='#e8f6ff'; rr(-8,13,16,7,2); ctx.fill();
  ctx.restore();
}
function lighten(hex){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  r=Math.round(r+(255-r)*.45); g=Math.round(g+(255-g)*.45); b=Math.round(b+(255-b)*.45);
  return `rgb(${r},${g},${b})`;
}
/* 전체 지도 모드용 큰 구역 표지판 */
function drawZoneSign(z, hl){
  const rides = ridesIn(z), sts = stationsIn(z);
  const c = z.sign || { x:z.x+z.w/2, y:z.y+z.h/2 };
  const w = 176, lineH = 17, h = 50 + (rides.length+sts.length)*lineH + 8;
  const lift = hl ? Math.sin(t*6)*3 : 0;
  ctx.save(); ctx.translate(c.x, c.y+lift);
  ctx.fillStyle='rgba(0,0,0,.18)'; rr(-w/2+4,-h/2+7,w,h,18); ctx.fill();
  ctx.fillStyle='#fff'; rr(-w/2,-h/2,w,h,18); ctx.fill();
  ctx.lineWidth = hl?5:3; ctx.strokeStyle=z.stroke; ctx.stroke();
  // 헤더: 이모지 + 구역명
  ctx.fillStyle=z.stroke; rr(-w/2,-h/2,w,42,18); ctx.fill(); ctx.fillRect(-w/2,-h/2+24,w,18);
  ctx.font='22px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle='#000'; ctx.fillText(z.emoji, -w/2+12, -h/2+21);
  ctx.fillStyle='#fff'; ctx.font='bold 15px sans-serif'; ctx.fillText(z.name, -w/2+44, -h/2+21);
  // 기구 목록
  ctx.font='12px sans-serif'; ctx.textBaseline='middle';
  rides.forEach((r,i)=>{
    const y = -h/2+42+10+i*lineH;
    ctx.fillStyle=r.color; ctx.beginPath(); ctx.arc(-w/2+18, y, 4, 0, 7); ctx.fill();
    ctx.fillStyle='#3b3b58'; ctx.textAlign='left'; ctx.fillText(r.name, -w/2+28, y);
    const b = getBest(r.id);
    if (b!=null){ ctx.fillStyle='#b9a300'; ctx.textAlign='right'; ctx.fillText('🏆', w/2-10, y); }
  });
  sts.forEach((s,i)=>{
    const y = -h/2+42+10+(rides.length+i)*lineH;
    ctx.textAlign='left'; ctx.fillStyle='#000'; ctx.font='10px sans-serif'; ctx.fillText(s.lift.emoji, -w/2+12, y);
    ctx.fillStyle=s.lift.color; ctx.font='bold 11px sans-serif'; ctx.fillText(`${s.lift.name} → ${zoneById(s.to.zone).name}`, -w/2+28, y);
  });
  ctx.font='12px sans-serif';
  ctx.fillStyle=z.stroke; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
  ctx.fillText(hl ? '▶ 클릭해서 입장' : `놀이기구 ${rides.length}곳`, 0, h/2-9);
  ctx.restore();
}

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function poly(pts, ox=0, oy=0){ ctx.beginPath(); pts.forEach(([x,y],i)=> i?ctx.lineTo(x+ox,y+oy):ctx.moveTo(x+ox,y+oy)); ctx.closePath(); }
/* 공원 바깥 숲 나무 (섬 밖 영역에만) */
const FOREST = [];
for (let i=0;i<140;i++){
  const x = ((i*197)%1120)-60, y = ((i*331)%820)-60;
  if (!inPoly({x,y}, PARK) && !inPoly({x:x+30,y}, PARK) && !inPoly({x:x-30,y}, PARK) && !inPoly({x,y:y+30}, PARK) && !inPoly({x,y:y-30}, PARK)) FOREST.push([x,y]);
}
function drawLandmark(L){
  ctx.save(); ctx.translate(L.x, L.y);
  if (L.kind==='tree'){ ctx.fillStyle='#8d6744'; ctx.fillRect(-4,-4,8,22); ctx.fillStyle='#ffb3d1'; ctx.beginPath(); ctx.arc(0,-14,18,0,7); ctx.arc(-13,-5,12,0,7); ctx.arc(13,-5,12,0,7); ctx.fill(); ctx.fillStyle='#ffd766'; for(let i=0;i<5;i++){ctx.beginPath(); ctx.arc(Math.cos(t+i*1.3)*14, -14+Math.sin(t+i*1.3)*10, 2.5,0,7); ctx.fill();} }
  else if (L.kind==='rose'){ for(let i=0;i<6;i++){ ctx.fillStyle=['#ff6f9c','#ff8fb1','#ff4d7d'][i%3]; ctx.beginPath(); ctx.arc(-25+i*10, (i%2?-6:4), 6,0,7); ctx.fill(); } }
  else if (L.kind==='garden'){ ctx.fillStyle='#ffd766'; rr(-28,-10,56,20,10); ctx.fill(); ctx.fillStyle='#fff'; [-18,-6,6,18].forEach(x=>{ctx.beginPath(); ctx.arc(x,0,4,0,7); ctx.fill();}); }
  else if (L.kind==='water'){ ctx.strokeStyle='#4fb3e0'; ctx.lineWidth=3; ctx.beginPath(); for(let x=-30;x<=30;x+=6) ctx.lineTo(x, Math.sin(t*4+x*0.3)*3); ctx.stroke(); }
  else if (L.kind==='coaster'){ ctx.strokeStyle='#e85d5d'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-35,10); ctx.quadraticCurveTo(-15,-25,0,5); ctx.quadraticCurveTo(15,30,35,-10); ctx.stroke(); }
  ctx.fillStyle='rgba(59,59,88,.75)'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(L.name, 0, 16);
  ctx.restore();
}
function tree(x,y,c){
  ctx.fillStyle='rgba(0,0,0,.08)'; ctx.beginPath(); ctx.ellipse(x+3,y+18,18,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8d6744'; ctx.fillRect(x-3,y+4,6,14);
  ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.arc(x-10,y+6,11,0,Math.PI*2); ctx.arc(x+10,y+6,11,0,Math.PI*2); ctx.fill();
}

function drawRide(r, hl){
  const x=r.x-r.w/2, y=r.y-r.h/2;
  // 그림자
  ctx.fillStyle='rgba(0,0,0,.10)'; rr(x+4,y+6,r.w,r.h,22); ctx.fill();
  // 구역
  ctx.fillStyle = hl ? '#ffffff' : '#fff8ef'; rr(x,y,r.w,r.h,22); ctx.fill();
  ctx.lineWidth = hl ? 5 : 3; ctx.strokeStyle = r.color; ctx.stroke();
  // 아이콘
  ctx.save(); ctx.translate(r.x, r.y-8);
  const s = Math.min(r.w,r.h)/110;
  ctx.scale(s,s);
  ICONS[r.icon](ctx, t);
  ctx.restore();
  // 이름표
  ctx.fillStyle = r.color; rr(r.x-r.w/2+10, y+r.h-26, r.w-20, 20, 10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(r.name, r.x, y+r.h-16);
  // 입구 표시
  ctx.fillStyle = r.color; ctx.beginPath(); ctx.moveTo(r.x-7,y+r.h+2); ctx.lineTo(r.x+7,y+r.h+2); ctx.lineTo(r.x,y+r.h+10); ctx.fill();
}

function drawPlayer(){
  const {x,y} = player;
  if (player.riding){
    // 캐빈 안에 탄 모습 (살짝 흔들림)
    const L = player.riding.lift, sw = Math.sin(t*3)*2;
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(x,y+40,14,5,0,0,7); ctx.fill();
    ctx.save(); ctx.translate(x+sw, y-26);
    ctx.strokeStyle='#555'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,12); ctx.stroke();
    ctx.fillStyle=L.color; rr(-16,12,32,24,7); ctx.fill();
    ctx.fillStyle='#e8f6ff'; rr(-12,16,24,12,3); ctx.fill();
    ctx.save(); ctx.translate(0,24); ctx.scale(0.55*player.dir,0.55);
    ctx.fillStyle='#ffe0c4'; ctx.beginPath(); ctx.arc(0,-8,11,0,7); ctx.fill();
    ctx.fillStyle='#ffd766'; ctx.beginPath(); ctx.arc(-8,-17,5,0,7); ctx.arc(8,-17,5,0,7); ctx.fill();
    ctx.fillStyle='#3b3b58'; ctx.beginPath(); ctx.arc(3,-9,1.8,0,7); ctx.arc(8,-9,1.8,0,7); ctx.fill();
    ctx.restore(); ctx.restore();
    return;
  }
  const bob = player.moving ? Math.abs(Math.sin(player.frame))*4 : 0;
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(x,y+14,12,5,0,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(x, y-bob); ctx.scale(player.dir,1);
  // 몸
  ctx.fillStyle='#ff8fb1'; rr(-9,-6,18,20,7); ctx.fill();
  // 다리
  const leg = player.moving ? Math.sin(player.frame)*4 : 0;
  ctx.fillStyle='#3b3b58'; ctx.fillRect(-7,12+leg,5,6); ctx.fillRect(2,12-leg,5,6);
  // 머리
  ctx.fillStyle='#ffe0c4'; ctx.beginPath(); ctx.arc(0,-14,11,0,Math.PI*2); ctx.fill();
  // 머리띠 (귀)
  ctx.fillStyle='#ffd766'; ctx.beginPath(); ctx.arc(-8,-23,5,0,7); ctx.arc(8,-23,5,0,7); ctx.fill();
  // 눈
  ctx.fillStyle='#3b3b58'; ctx.beginPath(); ctx.arc(3,-15,1.8,0,7); ctx.arc(8,-15,1.8,0,7); ctx.fill();
  ctx.restore();
}

function openIntro(r){
  document.getElementById('introArt').innerHTML = ART[r.icon];
  document.getElementById('introArt').style.background = r.color;
  const tag = document.getElementById('introTag'); tag.textContent = r.tag; tag.style.background = r.color;
  document.getElementById('introName').textContent = r.name;
  document.getElementById('introDesc').textContent = r.desc;
  const stars = r.thrill>0 ? '★'.repeat(r.thrill)+'☆'.repeat(5-r.thrill) : '없음';
  const best = getBest(r.id);
  document.getElementById('introMeta').innerHTML =
    `<div><b>스릴</b>${stars}</div><div><b>대기시간</b>${r.wait}</div><div><b>종류</b>${r.type}</div>` +
    (best!=null ? `<div><b>최고 점수</b>🏆 ${best.toLocaleString()}</div>` : '');
  const play = document.getElementById('btnPlay');
  play.disabled = false; play.textContent = '🎮 게임 시작';
  checkGame(r).then(ok => { if(!ok){ play.disabled = true; play.textContent = '🎮 게임 시작 (준비중)'; } });
  currentRide = r;
  document.getElementById('intro').classList.add('open');
}

/* =========================================================
   미니게임 플러그인 시스템
   - games/<id>.html 을 iframe 으로 띄운다
   - 게임은 끝날 때 parent.postMessage({type:'EVERLAND_END', score}) 만 보내면 됨
   ========================================================= */
let currentRide = null;
const gameOK = {};                       // id → true/false 캐시
function gamePath(r){ return r.game || `games/${r.id}.html`; }
async function checkGame(r){
  if (gameOK[r.id] !== undefined) return gameOK[r.id];
  try {
    const res = await fetch(gamePath(r), { method:'HEAD', cache:'no-store' });
    gameOK[r.id] = res.ok;
  } catch(e){ gameOK[r.id] = false; }     // file:// 등에서는 fetch 불가 → 버튼은 활성 유지
  if (location.protocol === 'file:') gameOK[r.id] = true;
  return gameOK[r.id];
}
function getBest(id){ const v = localStorage.getItem('everland.best.'+id); return v==null?null:Number(v); }
function setBest(id, s){ const b = getBest(id); if (b==null || s>b){ localStorage.setItem('everland.best.'+id, s); return true; } return false; }

function launchGame(r){
  document.getElementById('intro').classList.remove('open');
  document.getElementById('result').classList.remove('open');
  document.getElementById('gameTitle').textContent = `${r.name}`;
  const f = document.getElementById('gameFrame');
  f.src = gamePath(r) + '?t=' + Date.now();
  document.getElementById('gameWrap').classList.add('open');
  f.onload = () => { try { f.contentWindow.postMessage({ type:'EVERLAND_START', ride:r.id, name:r.name }, '*'); } catch(e){} };
}
function closeGame(){
  document.getElementById('gameWrap').classList.remove('open');
  document.getElementById('gameFrame').src = 'about:blank';
}
function showResult(r, score, rank){
  const isNew = setBest(r.id, score);
  document.getElementById('resultName').textContent = r.name;
  document.getElementById('resultScore').textContent = Number(score).toLocaleString();
  const rk = document.getElementById('resultRank'); rk.textContent = rank ? `랭크 ${rank}` : (isNew?'NEW RECORD!':'클리어'); rk.style.display='inline-block';
  document.getElementById('resultBest').textContent = isNew ? '🏆 신기록 달성!' : `최고 점수 ${getBest(r.id).toLocaleString()}`;
  document.getElementById('result').classList.add('open');
}
window.addEventListener('message', e => {
  const d = e.data || {};
  if (!currentRide) return;
  if (d.type === 'EVERLAND_END'){ closeGame(); showResult(currentRide, Number(d.score)||0, d.rank); }
  else if (d.type === 'EVERLAND_QUIT'){ closeGame(); toast('🗺️ 지도로 돌아왔어요'); }
});
document.getElementById('btnPlay').addEventListener('click', ()=> currentRide && launchGame(currentRide));
document.getElementById('btnQuit').addEventListener('click', ()=>{ closeGame(); toast('🗺️ 지도로 돌아왔어요'); });
document.getElementById('btnResultMap').addEventListener('click', ()=> document.getElementById('result').classList.remove('open'));
document.getElementById('btnRetry').addEventListener('click', ()=> currentRide && launchGame(currentRide));
document.getElementById('btnBack').addEventListener('click', ()=>{
  document.getElementById('intro').classList.remove('open');
  toast('🗺️ 다음 기구를 골라보세요!');
});
document.getElementById('btnStart').addEventListener('click', ()=>{
  document.getElementById('splash').style.display='none';
  resize();
  toast('🎉 에버랜드에 오신 걸 환영해요! 먼저 구역을 골라보세요', 2600);
});
document.getElementById('btnOverview').addEventListener('click', ()=>{ exitZone(); toast('🗺️ 전체 지도로 돌아왔어요'); });

/* ---------- 루프 ---------- */
function loop(){ update(); draw(); requestAnimationFrame(loop); }
resize(); loop();
</script>
